<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Page not found — TinyNeed</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; color: #e8f7f1; background: radial-gradient(circle at top, #183b35, #071613 65%); }
    main { width: min(34rem, calc(100% - 3rem)); padding: 3rem 0; text-align: center; }
    .code { margin: 0; color: #70e1bd; font-size: clamp(4rem, 18vw, 8rem); font-weight: 800; line-height: 1; }
    h1 { margin: 1rem 0 .75rem; font-size: clamp(1.8rem, 6vw, 2.6rem); }
    p { color: #b5cbc4; line-height: 1.7; }
    a { display: inline-block; margin-top: 1.25rem; padding: .8rem 1.1rem; border-radius: 999px; color: #05231b; background: #70e1bd; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid white; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>The address may be mistyped or the page may have moved. Return to TinyNeed to find the practical tool you need.</p>
    <a href="/">Back to TinyNeed</a>
  </main>
</body>
</html>
